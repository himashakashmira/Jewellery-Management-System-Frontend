<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURUM JEWELS - Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #020617;
      color: white;
      margin: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020617;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 10px;
      border: 2px solid #020617;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #D4AF37;
    }

    .gold-text {
      color: #D4AF37;
    }

    .gold-bg {
      background-color: #D4AF37;
    }

    .card-bg {
      background-color: #0f172a;
      border: 1px solid #1e293b;
    }

    .modal {
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
    }

    /* Sidebar Active Class */
    .sidebar-active {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0) 100%);
      color: #fbbf24 !important;
      border-left: 4px solid #fbbf24;
    }
  </style>
</head>

<body class="flex h-screen overflow-hidden">

  <!-- 1. SIDEBAR CONTAINER -->
  <div id="sidebar-container" class="h-full flex-shrink-0">
    <!-- sidebar.html will load here -->
  </div>

  <!-- 2. RIGHT SIDE CONTENT WRAPPER -->
  <div class="flex-1 flex flex-col h-full overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header
      class="h-20 flex justify-between items-center px-8 sticky top-0 bg-[#020617]/90 backdrop-blur-md z-30 border-b border-slate-800/50 flex-shrink-0">
      <div>
        <h2 class="text-xl font-bold tracking-widest text-white uppercase leading-none italic">AURUM <span
            class="gold-text">JEWELS</span></h2>
        <p class="text-slate-500 text-[10px] uppercase tracking-[0.2em] mt-1 italic">Inventory Management</p>
      </div>

      <div class="flex items-center gap-6">
        <!-- Search Bar -->
        <div class="relative group hidden xl:block">
          <i
            class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs group-focus-within:text-yellow-500 transition"></i>
          <input type="text" placeholder="Search inventory..."
            class="bg-slate-900 border border-slate-800 rounded-full py-2.5 pl-12 pr-6 text-xs text-white focus:outline-none focus:border-yellow-600 transition w-80 shadow-inner">
        </div>
        <!-- Profile -->
        <div
          class="flex items-center gap-3 bg-slate-900 border border-slate-800 py-1.5 pl-1.5 pr-4 rounded-full cursor-pointer hover:border-yellow-600/50 transition">
          <div
            class="w-8 h-8 bg-yellow-600 rounded-full flex items-center justify-center font-bold text-black text-sm shadow-lg shadow-yellow-600/20">
            A</div>
          <div class="hidden sm:block text-left">
            <p class="text-[11px] font-bold text-white leading-none uppercase tracking-wider">Admin</p>
            <p class="text-[9px] text-slate-500 leading-none mt-1 uppercase font-semibold italic">Manager</p>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main class="flex-1 p-10 overflow-y-auto">
      <div class="max-w-[1400px] mx-auto">
        <header class="mb-8 flex justify-between items-end">
          <div>
            <h2 class="text-4xl font-bold tracking-tight text-white">Inventory</h2>
            <p class="text-slate-400 mt-2">Manage stock, weights, and making charges across the store.</p>
          </div>
          <button onclick="toggleModal()"
            class="gold-bg text-black px-8 py-4 rounded-2xl font-bold hover:scale-105 transition shadow-lg shadow-yellow-600/20 active:scale-95 flex items-center gap-2">
            <i class="fas fa-plus"></i> Add New Item
          </button>
        </header>

        <!-- TABLE SECTION -->
        <div class="card-bg rounded-[2.5rem] overflow-hidden shadow-2xl">
          <div class="p-8 border-b border-slate-800 flex justify-between items-center bg-slate-900/30">
            <span class="text-sm font-bold text-slate-300 flex items-center gap-2">
              <i class="fas fa-box gold-text"></i>
              05 Items in stock
            </span>
            <div class="relative">
              <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs italic"></i>
              <input type="text" placeholder="Filter by name or ID..."
                class="bg-slate-900 border border-slate-800 rounded-full py-2.5 pl-10 pr-6 text-xs outline-none focus:border-yellow-600 transition w-64 italic">
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead class="bg-slate-900/50 text-slate-500 text-[10px] uppercase tracking-[0.2em] font-bold">
                <tr>
                  <th class="p-8">ID</th>
                  <th class="p-8 text-center">Image</th>
                  <th class="p-8">Name & Purity</th>
                  <th class="p-8 text-right">Weight (g)</th>
                  <th class="p-8 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="inventory-table-body" class="divide-y divide-slate-800/50">
                <tr class="hover:bg-slate-800/30 transition group">
                  <td class="p-8 gold-text font-bold text-sm tracking-widest uppercase">AUR-B-001</td>
                  <td class="p-8">
                    <div
                      class="w-16 h-16 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-center mx-auto overflow-hidden group-hover:border-yellow-600/50 transition">
                      <img src="https://img.icons8.com/color/96/diamond-ring.png" class="w-10 h-10 object-contain">
                    </div>
                  </td>
                  <td class="p-8">
                    <p class="text-sm font-bold text-white tracking-wide">Filigree Gold Bangle</p>
                    <span
                      class="bg-yellow-500/10 text-yellow-500 text-[9px] font-bold px-2 py-0.5 rounded border border-yellow-500/20 mt-1 inline-block">22K
                      GOLD</span>
                  </td>
                  <td class="p-8 text-right text-sm font-bold text-slate-300">24.50 g</td>
                  <td class="p-8 text-center">
                    <button class="text-slate-500 hover:text-white transition mx-2"><i class="fas fa-edit"></i></button>
                    <button class="text-slate-500 hover:text-red-500 transition mx-2"><i
                        class="fas fa-trash"></i></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD NEW ITEM MODAL -->
  <div id="itemModal" class="modal fixed inset-0 hidden flex items-center justify-center z-50 p-6">
    <div
      class="bg-[#0f172a] w-full max-w-[550px] rounded-[3rem] p-10 border border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
      <div class="flex justify-between items-center mb-8">
        <h3 class="text-2xl font-bold tracking-tight">Add New Piece</h3>
        <button onclick="toggleModal()"
          class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form class="space-y-6">
        <div>
          <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block ml-1">Item
            Name</label>
          <input type="text" id="item-name" placeholder="e.g. Antique Gold Choker"
            class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 outline-none focus:border-yellow-600 transition text-sm">
        </div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label
              class="text-[10px] font-bold text-slate-500 mb-2 block uppercase tracking-widest ml-1">Category</label>
            <select id="item-category"
              class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 outline-none focus:border-yellow-600 transition text-sm appearance-none cursor-pointer">
              <option value="1">Necklace</option>
              <option value="2">Rings</option>
              <option value="3">Bangles</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 mb-2 block uppercase tracking-widest ml-1">Purity</label>
            <select id="item-purity"
              class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 outline-none focus:border-yellow-600 transition text-sm appearance-none cursor-pointer">
              <option value="22K">22K</option>
              <option value="24K">24K</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-[9px] font-bold text-slate-500 mb-2 block uppercase text-center">Weight (g)</label>
            <input type="number" id="item-weight" step="0.01" value="0.00"
              class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center font-bold outline-none focus:border-yellow-600">
          </div>
          <div>
            <label class="text-[9px] font-bold text-slate-500 mb-2 block uppercase text-center">Wastage (%)</label>
            <input type="number" id="item-wastage" value="0"
              class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center font-bold outline-none focus:border-yellow-600">
          </div>
          <div>
            <label class="text-[9px] font-bold text-slate-500 mb-2 block uppercase text-center">Labour (Rs.)</label>
            <input type="number" id="item-labour" value="0"
              class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center font-bold outline-none focus:border-yellow-600">
          </div>
        </div>
        <div class="flex gap-4 pt-6">
          <button type="button" onclick="toggleModal()"
            class="flex-1 bg-slate-800 p-4 rounded-2xl font-bold hover:bg-slate-700 transition">Cancel</button>
          <button type="button" id="btn-save-item"
            class="flex-1 gold-bg text-black p-4 rounded-2xl font-bold shadow-lg hover:scale-105 transition">Save
            Item</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleModal() {
      document.getElementById('itemModal').classList.toggle('hidden');
    }

    // Sidebar load with active state logic
    fetch('sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        const currentPath = window.location.pathname.split("/").pop() || "dashboard.html";
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          if (link.getAttribute('href') === currentPath) {
            link.classList.add('sidebar-active');
          }
        });
      });
  </script>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="js/inventory.js"></script>
</body>

</html>
