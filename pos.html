<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURUM JEWELS - Point of Sale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #020617; color: white; margin: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; border: 2px solid #020617; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }

        .gold-text { color: #D4AF37; }
        .gold-bg { background-color: #D4AF37; }
        .card-bg { background-color: #0f172a; border: 1px solid #1e293b; }
        .sidebar-active {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0) 100%);
            color: #fbbf24 !important;
            border-left: 4px solid #fbbf24;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 1. SIDEBAR CONTAINER -->
    <div id="sidebar-container" class="h-full flex-shrink-0">
        <!-- sidebar.html will load here -->
    </div>

    <!-- 2. MAIN POS WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- TOP HEADER -->
        <header class="h-20 flex justify-between items-center px-8 border-b border-slate-800/50 bg-[#020617]/90 backdrop-blur-md z-30 flex-shrink-0">
            <div>
                <h2 class="text-xl font-bold tracking-widest text-white uppercase leading-none italic">AURUM <span class="gold-text">JEWELS</span></h2>
                <p class="text-slate-500 text-[10px] uppercase tracking-[0.2em] mt-1 italic">Point of Sale / Billing</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden lg:flex gap-3">
                    <div class="bg-slate-900 border border-slate-800 px-4 py-1.5 rounded-xl text-[10px]">
                        <span class="text-slate-500 uppercase">22K</span> <b class="gold-text ml-2">Rs. 24,700/g</b>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 px-4 py-1.5 rounded-xl text-[10px]">
                        <span class="text-slate-500 uppercase">24K</span> <b class="gold-text ml-2">Rs. 26,800/g</b>
                    </div>
                </div>
                <div class="w-8 h-8 bg-yellow-600 rounded-full flex items-center justify-center font-bold text-black text-sm">A</div>
            </div>
        </header>

        <!-- CONTENT BODY: Split into Left (Items) and Right (Bill) -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- LEFT: ITEM SELECTION SECTION -->
            <main class="flex-1 p-8 overflow-y-auto">
                <div class="max-w-4xl mx-auto">
                    <header class="mb-8">
                        <h2 class="text-3xl font-bold tracking-tight">Point of Sale</h2>
                        <p class="text-slate-400 mt-1">Select items from the inventory to create a bill.</p>
                    </header>

                    <!-- Search -->
                    <div class="relative mb-10 group">
                        <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-yellow-500 transition"></i>
                        <input type="text" placeholder="Scan barcode or search items..." 
                               class="w-full bg-[#0f172a] border border-slate-800 rounded-[2rem] py-5 pl-16 pr-8 text-lg outline-none focus:border-yellow-600 transition shadow-2xl">
                    </div>

                    <!-- DYNAMIC ITEM GRID -->
                    <div id="pos-item-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-10">
                        <!-- Items will load here dynamically via AJAX -->
                        <p class="text-slate-500 italic">Loading items from inventory...</p>
                    </div>
                </div>
            </main>

            <!-- RIGHT: BILL SUMMARY (STICKY) -->
            <aside class="w-[450px] bg-slate-900/30 border-l border-slate-800/50 p-8 flex flex-col h-full shadow-2xl flex-shrink-0">
                <div class="flex justify-between items-center mb-10">
                    <h3 class="text-xl font-bold italic">Bill <span class="gold-text italic">Summary</span></h3>
                    <span id="cart-count" class="bg-yellow-500/10 text-yellow-500 text-[10px] px-3 py-1 rounded-full border border-yellow-500/20 font-bold uppercase">0 Items</span>
                </div>

                <!-- Scrollable Cart Area -->
                <div id="cart-items-container" class="flex-1 overflow-y-auto flex flex-col text-slate-600 text-center justify-center">
                    <div class="w-20 h-20 bg-slate-900 rounded-full flex items-center justify-center mx-auto mb-6 border border-slate-800">
                        <i class="fas fa-shopping-basket text-2xl opacity-20"></i>
                    </div>
                    <p class="text-sm font-medium italic">Your cart is currently empty.<br>Start adding items to bill.</p>
                </div>

                <!-- Totals -->
                <div class="pt-8 border-t border-slate-800 space-y-4">
                    <div class="flex justify-between text-slate-400 text-sm">
                        <span>Sub Total</span>
                        <span id="sub-total">Rs. 0.00</span>
                    </div>
                    <div class="flex justify-between font-bold text-2xl mt-4 pt-4 border-t border-slate-800/50">
                        <span class="italic">Grand Total</span>
                        <span id="grand-total" class="gold-text">Rs. 0.00</span>
                    </div>
                    <button onclick="completeSale()" class="w-full gold-bg text-black p-5 rounded-[1.5rem] font-bold text-lg shadow-xl shadow-yellow-600/20 hover:scale-[1.02] active:scale-95 transition mt-6 uppercase tracking-widest">
                        Complete Sale
                    </button>
                </div>
            </aside>

        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Sidebar load
        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                const currentPath = window.location.pathname.split("/").pop() || "dashboard.html";
                const navLinks = document.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.classList.add('sidebar-active');
                    }
                });
            });
    </script>
    <script src="js/pos.js"></script>
</body>
</html>
